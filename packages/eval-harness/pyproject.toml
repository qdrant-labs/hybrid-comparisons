[project]
name = "eval-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "astraberte9@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.8.0",
    "qdrant-client>=1.19.0",
    "qdrant-load",
]

[tool.uv.sources]
qdrant-load = { path = "../qdrant-load" }

[project.scripts]
eval-harness = "eval_harness:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
