<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recall, MRR, nDCG by quantization config (colbert, dbpedia)</title>
<style>
  :root {
    --wash:      #e2e7f5;
    --card:      #ffffff;
    --n30:       #28324d;
    --n50:       #576280;
    --n70:       #8f98b2;
    --n90:       #d4d9e6;
    --grid:      #e1e5f0;
    --blue30:    #0040a1;
    --blue50:    #2f6ff0;
    --blue70:    #89a9ff;
    --turbo-ring: #28324d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px;
    background: var(--wash);
    font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .frame {
    max-width: 1180px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 16px;
    padding: 44px 48px 36px;
  }
  .legend {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: center;
  }
  .legend-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .swatch {
    width: 15px;
    height: 15px;
    border-radius: 3px;
    display: inline-block;
  }
  .legend-label {
    font-size: 14px;
    color: var(--n30);
  }
  svg text { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
</style>
</head>
