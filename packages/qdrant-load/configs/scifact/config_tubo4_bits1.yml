collection_name: scifact_turbo4_tq1 # change based on configs (quantization, dtypes)
data:
  # do not change data path -- vectors are computed server-side via Qdrant Cloud Inference
  corpus:
    path: ../../data/scifact/corpus.jsonl
dense_vectors:
  dtype: turbo4
  quantization_config:
    turbo:
      bits: bits1
      memory: pinned
  memory: cold
colbert_vectors:
  dtype: turbo4
  quantization_config:
    turbo:
      bits: bits1
      memory: pinned
  memory: cold
  multivector_config:
    comparator: max_sim
  hnsw_config:
    m: 0 # indexing should be disabled since we are using these for rescoring (otherwise very expensive)
sparse_vectors:
  modifier: idf
