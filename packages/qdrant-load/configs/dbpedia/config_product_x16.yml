collection_name: dbpedia_product_x16 # product quantization, float32 base dtype
data:
  # do not change data path -- vectors are computed server-side via Qdrant Cloud Inference
  corpus:
    path: ../../data/dbpedia/corpus.jsonl
dense_vectors:
  dtype: float32
  quantization_config:
    product:
      compression: x16
      memory: pinned
  memory: cached
colbert_vectors:
  dtype: float32
  quantization_config:
    product:
      compression: x8 # colbert vectors are lower-dim, use a lighter compression
      memory: pinned
  memory: cached
  multivector_config:
    comparator: max_sim
  hnsw_config:
    m: 0 # indexing should be disabled since we are using these for rescoring (otherwise very expensive)
sparse_vectors:
  modifier: idf
