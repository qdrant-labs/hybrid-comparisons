collection_name: cqadupstack_android_float16_noquant # float16 base dtype, no quantization (baseline)
pre_embedded: true
data:
  # do not change data path -- vectors are computed server-side via Qdrant Cloud Inference
  corpus:
    path: ../../data/pre-embedded/cqadupstack-android/cqadupstack-android-corpus.jsonl.gz
dense_vectors:
  dtype: float16
  memory: cached
colbert_vectors:
  dtype: float16
  memory: cached
  multivector_config:
    comparator: max_sim
  hnsw_config:
    m: 0 # indexing should be disabled since we are using these for rescoring (otherwise very expensive)
sparse_vectors:
  modifier: idf
