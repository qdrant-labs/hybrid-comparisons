collection_name: cqadupstack_android_product_x16 # product quantization, float32 base dtype
pre_embedded: true
data:
  # do not change data path -- vectors are computed server-side via Qdrant Cloud Inference
  corpus:
    path: ../../data/pre-embedded/cqadupstack-android/cqadupstack-android-corpus.jsonl.gz
dense_vectors:
  dtype: float32
  quantization_config:
    product:
      compression: x16
      memory: pinned
  memory: cached
colbert_vectors:
  dtype: float32
  quantization_config:
    product:
      compression: x8 # colbert vectors are lower-dim, use a lighter compression
      memory: pinned
  memory: cached
  multivector_config:
    comparator: max_sim
  hnsw_config:
    m: 0 # indexing should be disabled since we are using these for rescoring (otherwise very expensive)
sparse_vectors:
  modifier: idf
